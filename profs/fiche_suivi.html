<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche de suivi des acquis — outilslp</title>
<style>
  :root{
    --ink:#1a2230;
    --paper:#ffffff;
    --muted:#5b6474;
    --line:#d7dbe3;
    --accent:#2a5fb0;
    --bg:#eef1f6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:Arial, Helvetica, sans-serif;
    color:var(--ink);
    background:var(--bg);
  }

  /* ---------- Barre d'outils (écran uniquement) ---------- */
  .toolbar{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:12px 16px;
    display:flex; flex-wrap:wrap; gap:10px 16px;
    align-items:flex-end;
    box-shadow:0 1px 4px rgba(0,0,0,.06);
  }
  .toolbar h1{
    font-size:15px; margin:0 18px 0 0; flex-basis:100%;
    color:var(--ink); font-weight:700;
  }
  .field{display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted);}
  .field select{
    font:inherit; font-family:Arial, sans-serif; font-size:13px;
    padding:6px 8px; border:1px solid var(--line); border-radius:6px;
    background:#fff; color:var(--ink); min-width:170px;
  }
  .field select:disabled{ background:#f1f3f7; color:var(--muted); cursor:not-allowed; }
  .btn{
    font-family:Arial, sans-serif; font-size:13px; font-weight:700;
    padding:8px 16px; border-radius:6px; border:1px solid var(--accent);
    background:var(--accent); color:#fff; cursor:pointer;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn.secondary{ background:#fff; color:var(--accent); }
  .status{ font-size:12px; color:var(--muted); align-self:center; margin-left:auto; }
  .toolbar-row{ display:flex; flex-wrap:wrap; gap:10px 16px; align-items:flex-end; width:100%; }

  /* ---------- Panneau de secours (chargement manuel du JSON) ---------- */
  #fallback{
    display:none; margin:16px; padding:16px; background:#fff7e6;
    border:1px solid #e8c777; border-radius:8px; font-size:13px; color:#5c4a12;
    max-width:760px;
  }
  #fallback.show{ display:block; }
  #fallback input[type=file]{ margin-top:8px; }

  /* ---------- Zone d'aperçu ---------- */
  .preview-wrap{
    padding:24px 0 60px;
    display:flex; flex-direction:column; align-items:center; gap:24px;
  }
  .sheet{
    background:var(--paper);
    width:210mm; min-height:297mm;
    box-shadow:0 2px 14px rgba(0,0,0,.18);
    padding:6mm;
    overflow:hidden;
  }
  /* Conteneur mesuré par l'auto-ajustement : sa hauteur suit le contenu,
     contrairement à .sheet qui est bloquée à 297mm par min-height. */
  .sheet-inner{ height:auto; }
  .sheet-label{
    font-size:11px; color:var(--muted); align-self:flex-start;
    width:210mm; margin:-14px 0 0 0;
  }

  /* ---------- Contenu de la fiche (imprimé) ---------- */
  .fiche-head{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:2.4pt solid var(--ink); padding-bottom:0.35em; margin-bottom:0.55em;
  }
  .fiche-head h2{
    margin:0; font-size:1.28em; letter-spacing:.2px;
  }
  .fiche-head .meta{ text-align:right; font-size:0.78em; color:var(--muted); }
  .fiche-spe{ font-size:0.86em; color:var(--accent); font-weight:700; margin-top:0.12em; }
  .fiche-nom{ font-size:0.9em; margin-top:0.15em; }
  .fiche-nom .ligne{
    display:inline-block; border-bottom:1px solid var(--ink); width:9em; margin-left:0.35em;
  }
  .fiche-legende{
    font-size:0.72em; color:var(--muted); margin:0.15em 0 0.6em 0;
  }

  .modules{ display:flex; flex-direction:column; gap:0; }
  .module-block{ border:0.7pt solid var(--line); margin-bottom:0.45em; break-inside:avoid; min-width:0; }
  .module-bandeau{
    font-weight:700; font-size:0.86em; padding:0.28em 0.55em;
    color:#20263a;
  }
  .module-domaine{
    font-weight:400; font-size:0.85em; opacity:.75; margin-left:0.4em;
  }
  .cases{
    display:grid;
    /* minmax(0,1fr) et non 1fr : sinon une colonne refuse de descendre sous la
       largeur de son mot le plus long et la grille déborde de la page. */
    grid-template-columns:repeat(var(--cols, 6), minmax(0, 1fr));
    gap:0.16em;
    padding:0.16em;
  }
  .case{
    border:0.6pt solid rgba(0,0,0,.14);
    border-radius:2px;
    padding:0.28em 0.4em 0.24em;
    display:flex; flex-direction:column; justify-content:space-between;
    min-height:3.5em;
  }
  /* overflow-wrap seul (sans word-break) : les mots ne se cassent que si c'est
     indispensable, et hyphens:auto place alors un vrai trait d'union. */
  .case .txt{ font-size:0.78em; line-height:1.15; overflow-wrap:break-word; hyphens:auto; }
  /* Etat de mesure : sans coupure forcee, un mot trop large deborde et devient
     detectable. Utilise uniquement le temps de l'auto-ajustement. */
  .mesure-mots .case .txt{ overflow-wrap:normal; hyphens:none; }
  .case .code{ font-weight:700; margin-right:0.35em; }
  .case .chks{
    display:flex; gap:0.3em; margin-top:0.28em; align-self:flex-start;
  }
  .chk{
    width:0.85em; height:0.85em; border:1pt solid #333; border-radius:1px;
    display:inline-block; flex:none;
  }

  /* ---------- Sélecteur de fond par domaine (variables injectées en JS) ---------- */
  .dom-0{ --dbg:#dbe7fb; --dbd:#a9c3ea; --dtxt:#1c4a86; }

  /* ---------- Impression ---------- */
  @page{ size:A4; margin:6mm; }
  @media print{
    html,body{ background:#fff; }
    .toolbar, #fallback, .sheet-label{ display:none !important; }
    .preview-wrap{ padding:0; gap:0; }
    .sheet{
      box-shadow:none; margin:0; width:auto; min-height:auto; padding:0;
    }
    .sheet + .sheet{ break-before:page; page-break-before:always; }
    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
  }
</style>
</head>

  function specialitesDe(formation){
    if(formation === "BACPRO") return SPE_BACPRO;
    if(formation === "CAP") return SPE_CAP;
    return [];
  }

  // Spécialité actuellement choisie, ou null (3PM, liste absente, mode manuel).
  function specialiteCourante(formation){
    var liste = specialitesDe(formation);
    if(!liste.length) return null;
    var nom = document.getElementById("sel-specialite").value;
    if(!nom || nom === SANS_SPECIALITE) return null;
    for(var i=0;i<liste.length;i++){
      if(liste[i].n === nom) return liste[i];
    }
    return null;
  }

  // Une spécialité sans physique-chimie ("SansPhCh") suit en revanche un
  // supplément de mathématiques : son groupement de maths cumule les deux tags.
  function sansPhCh(sp){ return !!sp && sp.p === "SansPhCh"; }

  // Groupement imposé par la spécialité pour la matière courante, ou null.
  function groupementDeSpecialite(formation, matiere){
    var sp = specialiteCourante(formation);
    if(!sp) return null;
    if(matiere === "M") return sansPhCh(sp) ? (sp.m + "+SansPhCh") : sp.m;
    // En CAP la physique-chimie n'est pas differenciee : pas de champ "p",
    // donc la specialite n'impose aucun groupement dans cette matiere.
    return (sansPhCh(sp) || !sp.p) ? null : sp.p;
  }

  // ===================== Chargement des données =====================
  function boot(items){
    DATA = items;
    buildFormationOptions();
  }

  fetch("resumes_items_LP.json")
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(boot)
    .catch(function(){
      document.getElementById("fallback").classList.add("show");
      document.getElementById("status").textContent = "En attente du fichier JSON…";
    });

  document.getElementById("file-input").addEventListener("change", function(e){
    var f = e.target.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var items = JSON.parse(reader.result);
        document.getElementById("fallback").classList.remove("show");
        boot(items);
      }catch(err){
        alert("JSON illisible : " + err.message);
      }
    };
    reader.readAsText(f, "utf-8");
  });

  // ===================== Construction du sélecteur =====================
  function uniq(arr){
    var seen = {}, out = [];
    for(var i=0;i<arr.length;i++){ if(!seen[arr[i]]){ seen[arr[i]]=1; out.push(arr[i]); } }
    return out;
  }

  function matieresDisponibles(niveau, formation){
    var set = uniq(DATA.filter(function(d){return d.niveau===niveau;}).map(function(d){return d.matiere;}));
    var out = MATIERE_ORDRE.filter(function(m){ return set.indexOf(m) !== -1; });
    // Une spécialité sans physique-chimie ne doit pas proposer cette matière.
    if(formation && sansPhCh(specialiteCourante(formation))){
      out = out.filter(function(m){ return m !== "PhCh"; });
    }
    return out;
  }

  // "SansPhCh" n'est pas un groupement : c'est le supplement de mathematiques
  // (module "Calculs commerciaux et financiers") suivi par les specialites qui
  // n'ont pas de physique-chimie. Il se combine donc a une lettre A/B/C au lieu
  // de s'y substituer : le choix propose devient "C" ou "C + sans PhCh".
  function groupementsDisponibles(niveau, matiere){
    var tags = {};
    DATA.forEach(function(d){
      if(d.niveau===niveau && d.matiere===matiere && d.groupements && d.groupements.length){
        d.groupements.forEach(function(g){ tags[g]=1; });
      }
    });
    var base = GROUPEMENT_ORDRE.filter(function(g){ return tags[g] && g !== "SansPhCh"; });
    if(!tags["SansPhCh"]) return base;

    var out = [];
    base.forEach(function(g){ out.push(g); out.push(g + "+SansPhCh"); });
    return out;
  }

  // Un choix de groupement peut cumuler plusieurs tags ("C+SansPhCh").
  function tagsDuGroupement(code){ return code ? code.split("+") : []; }

  function libelleGroupement(code){
    var t = tagsDuGroupement(code);
    var base = GROUPEMENT_LABEL[t[0]] || t[0];
    return (t.indexOf("SansPhCh") !== -1) ? (base + " — sans physique-chimie") : base;
  }

  // Chaine des selecteurs : Formation -> Specialite -> Annee -> Matiere -> Groupement.
  // Chaque etage reconstruit le suivant, puis render() est appele une seule fois au bout.
  function buildFormationOptions(){
    var selF = document.getElementById("sel-formation");
    selF.innerHTML = "";
    FORMATION_ORDRE.forEach(function(f){
      var annees = FORMATION_ANNEES[f].filter(function(n){
        return DATA.some(function(d){ return d.niveau === n; });
      });
      if(!annees.length) return;
      var o = document.createElement("option");
      o.value = f; o.textContent = FORMATION_LABEL[f] || f;
      selF.appendChild(o);
    });
    selF.value = "BACPRO";
    selF.onchange = function(){ buildSpecialiteOptions(); };
    buildSpecialiteOptions();
  }

  function buildSpecialiteOptions(){
    var formation = document.getElementById("sel-formation").value;
    var liste = specialitesDe(formation);
    var field = document.getElementById("field-specialite");
    var selS = document.getElementById("sel-specialite");
    var ancien = selS.value;
    selS.innerHTML = "";

    if(!liste.length){
      // 3PM, ou liste de specialites non encore fournie : on masque le champ
      // et le groupement se regle directement, comme avant.
      field.style.display = "none";
    }else{
      field.style.display = "";
      var o0 = document.createElement("option");
      o0.value = SANS_SPECIALITE;
      o0.textContent = "— choisir le groupement à la main —";
      selS.appendChild(o0);
      liste.forEach(function(sp){
        var o = document.createElement("option");
        o.value = sp.n; o.textContent = sp.n;
        selS.appendChild(o);
      });
      // On conserve la specialite en cours si elle existe toujours dans la liste.
      selS.value = (ancien && selS.querySelector('option[value="' + cssEscape(ancien) + '"]')) ? ancien : SANS_SPECIALITE;
    }
    selS.onchange = function(){ buildNiveauOptions(); };
    buildNiveauOptions();
  }

  // Echappe les guillemets doubles pour un selecteur d'attribut.
  function cssEscape(v){ return String(v).replace(/["\\]/g, "\\$&"); }

  function buildNiveauOptions(){
    var formation = document.getElementById("sel-formation").value;
    var selN = document.getElementById("sel-niveau");
    var ancien = selN.value;
    selN.innerHTML = "";
    var niveaux = FORMATION_ANNEES[formation].filter(function(n){
      return DATA.some(function(d){ return d.niveau===n; });
    });
    niveaux.forEach(function(n){
      var o = document.createElement("option");
      o.value = n; o.textContent = NIVEAU_LABEL[n] || n;
      selN.appendChild(o);
    });
    // Le champ Annee n'a d'interet que si la formation compte plusieurs annees.
    selN.parentNode.style.display = (niveaux.length > 1) ? "" : "none";
    selN.value = (niveaux.indexOf(ancien) !== -1) ? ancien : niveaux[0];
    selN.onchange = function(){ buildMatiereOptions(); };
    buildMatiereOptions();
  }

  function buildMatiereOptions(){
    var niveau = document.getElementById("sel-niveau").value;
    var selM = document.getElementById("sel-matiere");
    var ancien = selM.value;
    selM.innerHTML = "";
    var matieres = matieresDisponibles(niveau, document.getElementById("sel-formation").value);
    matieres.forEach(function(m){
      var o = document.createElement("option");
      o.value = m; o.textContent = MATIERE_LABEL[m] || m;
      selM.appendChild(o);
    });
    selM.value = (matieres.indexOf(ancien) !== -1) ? ancien
               : (matieres.indexOf("PhCh") !== -1 ? "PhCh" : matieres[0]);
    selM.onchange = function(){ buildGroupementOptions(); };
    buildGroupementOptions();
  }

  function buildGroupementOptions(){
    var formation = document.getElementById("sel-formation").value;
    var niveau = document.getElementById("sel-niveau").value;
    var matiere = document.getElementById("sel-matiere").value;
    var groupements = groupementsDisponibles(niveau, matiere);
    var field = document.getElementById("field-groupement");
    var selG = document.getElementById("sel-groupement");
    var ancien = selG.value;
    selG.innerHTML = "";

    if(groupements.length === 0){
      field.style.display = "none";
      selG.disabled = false;
    }else{
      field.style.display = "";
      groupements.forEach(function(g){
        var o = document.createElement("option");
        o.value = g; o.textContent = libelleGroupement(g);
        selG.appendChild(o);
      });

      // Si une specialite est choisie, elle IMPOSE le groupement : on le
      // positionne et on verrouille la liste pour eviter un reglage incoherent.
      var impose = groupementDeSpecialite(formation, matiere);
      if(impose && groupements.indexOf(impose) !== -1){
        selG.value = impose;
        selG.disabled = true;
      }else{
        selG.disabled = false;
        selG.value = (groupements.indexOf(ancien) !== -1) ? ancien : groupements[0];
      }
    }
    selG.onchange = render;
    render();
  }

  document.getElementById("btn-recalc").onclick = render;
  document.getElementById("btn-print").onclick = function(){ window.print(); };
  window.addEventListener("resize", debounce(render, 300));

  function debounce(fn, ms){
    var t;
    return function(){ clearTimeout(t); t = setTimeout(fn, ms); };
  }

  // ===================== Filtrage + regroupement =====================
  function itemsSelectionnes(){
    var niveau = document.getElementById("sel-niveau").value;
    var matiere = document.getElementById("sel-matiere").value;
    var field = document.getElementById("field-groupement");
    var groupement = (field.style.display !== "none") ? document.getElementById("sel-groupement").value : null;

    return DATA.filter(function(d){
      if(d.niveau !== niveau || d.matiere !== matiere) return false;
      if(groupement === null) return true;
      if(!d.groupements || d.groupements.length === 0) return true;
      var tags = tagsDuGroupement(groupement);
      for(var i=0;i<tags.length;i++){
        if(d.groupements.indexOf(tags[i]) !== -1) return true;
      }
      return false;
    });
  }

  // regroupe en conservant l'ordre d'apparition dans le fichier
  function grouperParModule(items){
    var order = [], map = {};
    items.forEach(function(it){
      var key = it.domaine + " || " + it.module;
      if(!map[key]){ map[key] = { domaine: it.domaine, module: it.module, items: [] }; order.push(key); }
      map[key].items.push(it);
    });
    return order.map(function(k){ return map[k]; });
  }

  function repartirPages(modules, niveau, matiere){
    var page2Domaines = null;
    if((niveau === "1PRO" || niveau === "TPRO")){
      if(matiere === "M") page2Domaines = DOMAINES_PAGE2_MATHS;
      else if(matiere === "PhCh") page2Domaines = DOMAINES_PAGE2_SCIENCES;
    }
    if(!page2Domaines){
      return { page1: modules, page2: [] };
    }
    var page1 = modules.filter(function(m){ return page2Domaines.indexOf(m.domaine) === -1; });
    var page2 = modules.filter(function(m){ return page2Domaines.indexOf(m.domaine) !== -1; });

    // Ordre imposé pour les sciences en page 1
    if(matiere === "PhCh"){
      page1.sort(function(a,b){
        var ia = ORDRE_PAGE1_SCIENCES.indexOf(a.domaine);
        var ib = ORDRE_PAGE1_SCIENCES.indexOf(b.domaine);
        if(ia === -1) ia = 999; if(ib === -1) ib = 999;
        if(ia !== ib) return ia - ib;
        return 0; // conserve l'ordre relatif d'origine sinon (tri stable)
      });
    }
    return { page1: page1, page2: page2 };
  }

  // ===================== Couleurs par domaine =====================
  function paletteDomaines(domaines){
    var palette = {};
    var n = domaines.length || 1;
    domaines.forEach(function(dom, i){
      var hue = Math.round((360 / n) * i);
      palette[dom] = {
        bg: "hsl(" + hue + ",48%,91%)",
        border: "hsl(" + hue + ",40%,74%)",
        text: "hsl(" + hue + ",62%,28%)"
      };
    });
    return palette;
  }

  // ===================== Rendu HTML d'une page =====================
  function renderModulesHTML(modules, palette){
    var html = '<div class="modules">';
    modules.forEach(function(mod){
      var col = palette[mod.domaine] || { bg:"#e6e9ef", border:"#c7ccd6", text:"#333" };
      html += '<div class="module-block" style="border-color:'+col.border+';">';
      html += '<div class="module-bandeau" style="background:'+col.bg+';">';
      html += escapeHTML(mod.module);
      html += '<span class="module-domaine">— ' + escapeHTML(mod.domaine) + '</span>';
      html += '</div>';
      html += '<div class="cases" data-n="' + mod.items.length + '">';
      mod.items.forEach(function(it){
        html += '<div class="case" style="border-color:'+col.border+';">';
        html += '<div class="txt"><span class="code" style="color:'+col.text+';">' + escapeHTML(it.code) + '</span>' + coupuresDouces(escapeHTML(it.resume)) + '</div>';
        html += '<div class="chks"><span class="chk"></span><span class="chk"></span><span class="chk"></span></div>';
        html += '</div>';
      });
      html += '</div></div>';
    });
    html += '</div>';
    return html;
  }

  // Offre au navigateur des points de coupure naturels (apres "/" ou un tiret)
  // pour eviter qu'il ne casse un mot en plein milieu faute de mieux.
  function coupuresDouces(html){
    return html.replace(/([\/\u2013\u2014-])/g, "$1<wbr>");
  }

  function escapeHTML(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function enteteHTML(titreSuffixe, niveau, matiere, groupementLabel, specialite){
    var titre = "GRILLE DE SUIVI DES ACQUIS — " + NIVEAU_LABEL[niveau] + " · " + MATIERE_LABEL[matiere];
    if(groupementLabel) titre += " · " + groupementLabel;
    if(titreSuffixe) titre += " " + titreSuffixe;
    var html = '<div class="fiche-head">';
    html += '<div><h2>' + escapeHTML(titre) + '</h2>';
    // Le nom de la specialite est ce que l'eleve reconnait ; le code de
    // groupement reste dans le titre pour le reperage cote enseignant.
    if(specialite) html += '<div class="fiche-spe">' + escapeHTML(specialite) + '</div>';
    html += '<div class="fiche-nom">Nom : <span class="ligne">&nbsp;</span></div></div>';
    html += '<div class="meta">outilslp.netlify.app</div>';
    html += '</div>';
    html += '<div class="fiche-legende">Coche une case à chaque passage (1<sup>er</sup>, 2<sup>e</sup>, 3<sup>e</sup>).</div>';
    return html;
  }

  // ===================== Rendu principal =====================
  function render(){
    if(!DATA) return;
    var niveau = document.getElementById("sel-niveau").value;
    var matiere = document.getElementById("sel-matiere").value;
    var fieldG = document.getElementById("field-groupement");
    var groupementCode = (fieldG.style.display !== "none") ? document.getElementById("sel-groupement").value : null;
    var groupementLabel = groupementCode ? libelleGroupement(groupementCode) : "";

    var selS = document.getElementById("sel-specialite");
    var specialite = (document.getElementById("field-specialite").style.display !== "none"
                      && selS.value && selS.value !== SANS_SPECIALITE) ? selS.value : "";

    var items = itemsSelectionnes();
    var modules = grouperParModule(items);
    var parts = repartirPages(modules, niveau, matiere);

    var allDomaines = uniq(modules.map(function(m){ return m.domaine; }));
    var palette = paletteDomaines(allDomaines);

    var page1El = document.getElementById("page1");
    var page2El = document.getElementById("page2");
    var page2Label = document.getElementById("page2-label");

    page1El.innerHTML = '<div class="sheet-inner">' +
      enteteHTML("", niveau, matiere, groupementLabel, specialite) +
      renderModulesHTML(parts.page1, palette) + '</div>';

    if(parts.page2.length){
      page2El.style.display = "";
      page2Label.style.display = "";
      page2El.innerHTML = '<div class="sheet-inner">' +
        enteteHTML("— page 2", niveau, matiere, groupementLabel, specialite) +
        renderModulesHTML(parts.page2, palette) + '</div>';
    }else{
      page2El.style.display = "none";
      page2Label.style.display = "none";
      page2El.innerHTML = "";
    }

    document.getElementById("status").textContent =
      items.length + " items · " + modules.length + " modules" +
      (parts.page2.length ? " (2 pages)" : " (1 page)");

    // Ajustement après le rendu (laisser le navigateur peindre une fois)
    requestAnimationFrame(function(){
      autofit(page1El);
      if(parts.page2.length) autofit(page2El);
    });
  }

  // ===================== Auto-ajustement (police + colonnes) =====================
  // Deux réglages indépendants : le nombre de colonnes et la taille de police.
  // On mesure .sheet-inner et NON .sheet, dont le min-height de 297mm masquerait
  // toujours la hauteur réelle du contenu.
  var COL_CANDIDATES = [9,8,7,6,5,4,3];

  // Un module de 3 items dans une grille à 9 colonnes laisserait 6 cases vides :
  // chaque module se limite donc au nombre de colonnes qu'il peut réellement remplir.
  function appliquerColonnes(inner, cols){
    var blocs = inner.querySelectorAll(".cases");
    for(var i=0;i<blocs.length;i++){
      var n = parseInt(blocs[i].getAttribute("data-n"), 10) || cols;
      blocs[i].style.setProperty("--cols", Math.min(cols, n));
    }
  }

  function autofit(sheetEl){
    var inner = sheetEl.querySelector(".sheet-inner");
    if(!inner) return;

    // Hauteur imprimable réellement disponible, moins 1mm de sécurité.
    var targetH = (PAGE_H_MM - 1) * MM_TO_PX;

    function fits(fs){
      inner.style.fontSize = fs + "pt";
      return inner.scrollHeight <= targetH;
    }

    // Un mot plus large que sa colonne serait coupé en plein milieu ("Échan-
    // tillon") : la configuration est alors jugée illisible et écartée, même si
    // elle permettait une police plus grande.
    function motsEntiers(){
      inner.classList.add("mesure-mots");
      var txts = inner.querySelectorAll(".case .txt");
      var ok = true;
      for(var i=0;i<txts.length;i++){
        if(txts[i].scrollWidth > txts[i].clientWidth + 1){ ok = false; break; }
      }
      inner.classList.remove("mesure-mots");
      return ok;
    }

    // Pour chaque nombre de colonnes, la plus grande police qui tient en hauteur.
    var essais = [];
    COL_CANDIDATES.forEach(function(cols){
      appliquerColonnes(inner, cols);
      if(!fits(FS_MIN)) return;               // déborde même en police mini
      if(fits(FS_MAX)){ essais.push({cols:cols, fs:FS_MAX}); return; }

      var lo = FS_MIN, hi = FS_MAX, ok = FS_MIN;
      for(var i=0;i<18;i++){
        var mid = (lo + hi) / 2;
        if(fits(mid)){ ok = mid; lo = mid; } else { hi = mid; }
      }
      essais.push({cols:cols, fs:ok});
    });

    if(!essais.length){
      appliquerColonnes(inner, COL_CANDIDATES[0]);
      inner.style.fontSize = FS_MIN + "pt";
      return;
    }

    // De la plus grande police à la plus petite, on retient la première
    // configuration qui ne casse aucun mot ; à défaut, la plus grande police.
    essais.sort(function(a,b){ return b.fs - a.fs; });
    var choisi = essais[0];
    for(var k=0;k<essais.length;k++){
      appliquerColonnes(inner, essais[k].cols);
      inner.style.fontSize = essais[k].fs + "pt";
      if(motsEntiers()){ choisi = essais[k]; break; }
    }

    appliquerColonnes(inner, choisi.cols);
    inner.style.fontSize = choisi.fs + "pt";
  }

  window.addEventListener("beforeprint", function(){
    autofit(document.getElementById("page1"));
    if(document.getElementById("page2").style.display !== "none"){
      autofit(document.getElementById("page2"));
    }
  });

})();
</script>
</body>
</html>
