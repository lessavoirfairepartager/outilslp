<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcul littéral — entraînement aléatoire</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#0891b2;
  --primary-dark:#0e7490;
  --primary-light:#cffafe;
  --primary-soft:#ecfeff;
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#0f172a;
  --text-light:#64748b;
  --border:#e2e8f0;
  --success:#10b981;
  --success-bg:#d1fae5;
  --error:#ef4444;
  --error-bg:#fee2e2;
  --warn:#f59e0b;
  --warn-bg:#fef3c7;
  --pos:#1d4ed8;
  --neg:#dc2626;
  --const:#ea580c;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  line-height:1.5;padding:.75rem;min-height:100vh;
}
.container{max-width:920px;margin:0 auto}
.math{font-family:"Cambria Math","Latin Modern Math","Times New Roman",serif}

/* Header */
header{
  text-align:center;padding:1.25rem 1rem;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:white;border-radius:1rem;margin-bottom:1rem;
  box-shadow:0 4px 12px rgba(8,145,178,.15);
}
header .emoji{font-size:2.25rem;margin-bottom:.25rem}
header h1{font-size:1.5rem;font-weight:700;margin-bottom:.25rem}
header .subtitle{opacity:.9;font-size:.9rem}

/* Mode bar */
.mode-bar{
  display:flex;gap:.5rem;justify-content:center;
  margin-bottom:.75rem;flex-wrap:wrap;
}
.mode-btn{
  padding:.6rem 1.1rem;border:2px solid var(--border);
  background:var(--card);border-radius:.6rem;cursor:pointer;
  font-weight:600;font-size:.9rem;transition:all .2s;
}
.mode-btn:hover{border-color:var(--primary)}
.mode-btn.active{
  background:var(--primary);color:white;border-color:var(--primary);
  box-shadow:0 2px 6px rgba(8,145,178,.3);
}

/* Tabs */
.tabs{
  display:flex;gap:.25rem;background:var(--card);
  padding:.35rem;border-radius:.75rem;border:1px solid var(--border);
  margin-bottom:1rem;overflow-x:auto;
}
.tab{
  flex:1;padding:.7rem .5rem;border:none;background:transparent;
  cursor:pointer;font-weight:600;font-size:.9rem;border-radius:.5rem;
  white-space:nowrap;color:var(--text-light);transition:all .2s;
  min-width:fit-content;
}
.tab:hover{background:var(--bg)}
.tab.active{background:var(--primary-light);color:var(--primary-dark)}

/* Card */
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:1rem;padding:1.25rem;margin-bottom:.85rem;
}

.q-label{
  font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-light);margin-bottom:.5rem;font-weight:700;
}

.question{
  font-size:1.6rem;font-weight:600;padding:1.1rem;
  background:var(--primary-soft);border-radius:.75rem;
  margin-bottom:1rem;text-align:center;color:var(--primary-dark);
  border:2px dashed var(--primary-light);
}

.question.fr{font-family:inherit;font-size:1.25rem;font-weight:500}

/* Choices */
.choices{
  display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.75rem;
}
@media(max-width:520px){.choices{grid-template-columns:1fr}}
.choice{
  padding:.95rem;background:var(--card);border:2px solid var(--border);
  border-radius:.75rem;cursor:pointer;font-size:1.2rem;
  text-align:center;transition:all .15s;line-height:1.3;
}
.choice:hover:not(.locked){border-color:var(--primary);background:var(--primary-soft)}
.choice.selected{border-color:var(--primary);background:var(--primary-light)}
.choice.correct{border-color:var(--success);background:var(--success-bg);color:#064e3b}
.choice.incorrect{border-color:var(--error);background:var(--error-bg);color:#7f1d1d}
.choice.locked{cursor:default}

/* Input mode (Calculer) */
.calc-pair{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.75rem}
@media(max-width:520px){.calc-pair{grid-template-columns:1fr}}
.calc-card{
  background:var(--bg);padding:.9rem;
  border-radius:.75rem;border:1px solid var(--border);
}
.calc-card .label-line{font-weight:600;margin-bottom:.5rem;color:var(--text-light)}
.calc-card .x-val{
  display:inline-block;padding:.15rem .55rem;
  background:var(--primary-light);color:var(--primary-dark);
  border-radius:.4rem;font-weight:700;font-size:1.05rem;
}
.calc-card input{
  width:100%;padding:.6rem;border:2px solid var(--border);
  border-radius:.5rem;font-size:1.15rem;text-align:center;
  font-family:inherit;
}
.calc-card input:focus{outline:none;border-color:var(--primary)}
.calc-card.ok input{border-color:var(--success);background:var(--success-bg)}
.calc-card.ko input{border-color:var(--error);background:var(--error-bg)}

/* Actions */
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.75rem}
.btn{
  padding:.75rem 1.15rem;border-radius:.55rem;font-weight:700;
  cursor:pointer;border:none;font-size:.95rem;transition:all .2s;
}
.btn-primary{background:var(--primary);color:white}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--card);border:2px solid var(--border);color:var(--text)}
.btn-secondary:hover{background:var(--bg);border-color:var(--primary)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Feedback */
.feedback{
  padding:.85rem 1rem;border-radius:.75rem;margin-bottom:.75rem;
  font-weight:600;display:none;
}
.feedback.show{display:block}
.feedback.success{background:var(--success-bg);color:#064e3b;border:2px solid var(--success)}
.feedback.error{background:var(--error-bg);color:#7f1d1d;border:2px solid var(--error)}

/* Aide block */
.aide{
  background:var(--warn-bg);border:2px solid var(--warn);
  border-radius:.75rem;padding:1rem;margin-bottom:.75rem;
}
.aide h3{
  color:#92400e;font-size:.95rem;margin-bottom:.5rem;
  display:flex;align-items:center;gap:.4rem;
}
.aide-content{font-size:1rem;line-height:1.7}
.aide-content .step{
  background:white;padding:.55rem .75rem;border-radius:.5rem;
  margin:.4rem 0;font-size:1.1rem;
}
.aide-content .arrow{color:#92400e;font-weight:700;margin:0 .25rem}

/* Decomposition (réduire) */
.decomp{
  background:white;padding:.75rem;border-radius:.5rem;
  margin:.4rem 0;font-size:1.15rem;
}
.decomp .row{
  display:flex;align-items:center;gap:.5rem;
  flex-wrap:wrap;padding:.25rem 0;
}
.decomp .lbl{
  font-size:.85rem;color:var(--text-light);
  min-width:9rem;font-weight:600;
}
.pos{color:var(--pos);font-weight:700}
.neg{color:var(--neg);font-weight:700}
.cst{color:var(--const);font-weight:700}
.eq-result{
  margin-top:.5rem;padding:.6rem;background:var(--primary-soft);
  border-radius:.4rem;text-align:center;font-size:1.2rem;font-weight:700;
}

/* Score */
.score-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:.7rem 1rem;background:var(--card);border:1px solid var(--border);
  border-radius:.75rem;flex-wrap:wrap;gap:.5rem;
}
.score-stat{font-weight:600;color:var(--text-light);font-size:.95rem}
.score-stat strong{color:var(--primary-dark);font-size:1.1rem}

.tip{
  font-size:.85rem;color:var(--text-light);
  text-align:center;margin:.4rem 0 .75rem 0;font-style:italic;
}

sup{font-size:.7em;vertical-align:super}
.var{font-style:italic;font-family:"Cambria Math",serif}

/* Bouton fiche (visible uniquement en mode Défi+) */
.btn-fiche{display:none;background:#7c3aed;color:white}
.btn-fiche:hover{background:#6d28d9}
body.defi-plus .btn-fiche{display:inline-block}

/* Modale */
.modal-bg{
  display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);
  z-index:100;align-items:center;justify-content:center;padding:1rem;
}
.modal-bg.show{display:flex}
.modal{
  background:white;border-radius:1rem;padding:1.5rem;
  width:100%;max-width:26rem;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal h2{font-size:1.15rem;margin-bottom:.5rem;color:var(--primary-dark)}
.modal p{color:var(--text-light);margin-bottom:1rem;font-size:.9rem}
.modal-checks{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1rem}
.modal-checks label{
  display:flex;align-items:center;gap:.65rem;
  padding:.6rem .8rem;border:2px solid var(--border);
  border-radius:.55rem;cursor:pointer;font-weight:600;
  transition:all .15s;
}
.modal-checks label:hover{border-color:var(--primary)}
.modal-checks label.on{border-color:var(--primary);background:var(--primary-soft)}
.modal-checks input{width:1.1rem;height:1.1rem;cursor:pointer;accent-color:var(--primary)}
.dist-info{
  padding:.7rem;border-radius:.5rem;text-align:center;
  font-weight:600;font-size:.9rem;margin-bottom:1rem;
}
.dist-info.ok{background:var(--success-bg);color:#064e3b}
.dist-info.warn{background:var(--warn-bg);color:#92400e}
.modal-actions{display:flex;gap:.5rem;justify-content:flex-end}
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="emoji">🔢</div>
    <h1>Calcul littéral — entraînement</h1>
    <div class="subtitle">3<sup>e</sup> prépa-métiers · 2<sup>de</sup> Bac Pro · mode aléatoire</div>
  </header>

  <div class="mode-bar">
    <button class="mode-btn active" data-mode="defi">🎯 Défi (avec aide)</button>
    <button class="mode-btn" data-mode="defi-plus">🔒 Défi ⁺ (sans aide)</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="traduire">📝 Traduire</button>
    <button class="tab" data-tab="calculer">🧮 Calculer</button>
    <button class="tab" data-tab="developper">📂 Développer</button>
    <button class="tab" data-tab="reduire">🗜️ Réduire</button>
  </div>

  <div class="tip" id="tip"></div>

  <div class="card" id="exercise">
    <!-- généré dynamiquement -->
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btn-check">✓ Vérifier</button>
    <button class="btn btn-secondary" id="btn-next">🎲 Nouvelle question</button>
    <button class="btn btn-fiche" id="btn-fiche">📄 Générer une fiche</button>
  </div>

  <div class="feedback" id="feedback"></div>

  <div class="score-bar">
    <div class="score-stat">Score : <strong id="score">0 / 0</strong></div>
    <div class="score-stat">Réussite : <strong id="rate">—</strong></div>
    <button class="btn btn-secondary" onclick="resetScore()">↻ Reset</button>
  </div>

</div>

<!-- Modale de génération de fiche -->
<div class="modal-bg" id="modal-fiche">
  <div class="modal">
    <h2>📄 Générer une fiche d'exercices</h2>
    <p>Choisis les onglets à inclure. Les 10 exercices seront répartis sur les onglets sélectionnés.</p>
    <div class="modal-checks" id="modal-checks">
      <label class="on"><input type="checkbox" value="traduire" checked> 📝 Traduire en formule littérale</label>
      <label class="on"><input type="checkbox" value="calculer" checked> 🧮 Calculer une expression</label>
      <label class="on"><input type="checkbox" value="developper" checked> 📂 Développer une expression</label>
      <label class="on"><input type="checkbox" value="reduire" checked> 🗜️ Réduire une expression</label>
    </div>
    <div class="dist-info ok" id="dist-info">→ 3 + 3 + 2 + 2 = 10 exercices</div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modal-cancel">Annuler</button>
      <button class="btn btn-primary" id="modal-confirm">Générer la fiche</button>
    </div>
  </div>
</div>

<script>
/* ======================================================================== */
/* État global                                                                */
/* ======================================================================== */
const state = {
  tab:'traduire',
  mode:'defi',           // 'defi' avec aide, 'defi-plus' sans aide
  current:null,          // question courante
  answered:false,
  good:0, total:0,
};

const tips = {
  traduire:'Choisis l\'expression qui correspond à la phrase.',
  calculer:'Calcule la valeur de l\'expression pour chaque valeur de x donnée.',
  developper:'Distribue, puis simplifie. Choisis la forme développée et réduite.',
  reduire:'Rassemble les termes en x ensemble, et les nombres entre eux.',
};

/* ======================================================================== */
/* Helpers                                                                    */
/* ======================================================================== */
const M = '−';                                  // vrai signe moins
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function unique(arr){return [...new Set(arr)]}

// affichage joli d'un nombre signé en début d'expression
function fmtN(n){return n<0 ? M+Math.abs(n) : ''+n}
// avec signe + explicite (pour milieu d'expression)
function fmtSig(n){return n<0 ? ' '+M+' '+Math.abs(n) : ' + '+n}

// formate un terme ax (a peut être 1, -1, etc.)
function fmtCoef(a, varStr='x'){
  if(a===0) return '0';
  if(a===1) return varStr;
  if(a===-1) return M+varStr;
  if(a<0) return M+Math.abs(a)+varStr;
  return a+varStr;
}
// même chose mais comme premier terme avec signe explicite (+ ou −) sauf si positif
function fmtCoefMid(a, varStr='x'){
  if(a===0) return '';
  if(a===1) return ' + '+varStr;
  if(a===-1) return ' '+M+' '+varStr;
  if(a<0) return ' '+M+' '+Math.abs(a)+varStr;
  return ' + '+a+varStr;
}
// formate une constante en milieu d'expression
function fmtCstMid(b){
  if(b===0) return '';
  return b<0 ? ' '+M+' '+Math.abs(b) : ' + '+b;
}

// Crée une expression complète ax+b ou ax^2+bx+c proprement
function fmtPoly2(a,b,c){
  // ax^2 + bx + c, première chose : terme principal
  let s='';
  if(a!==0){
    if(a===1) s+='x²';
    else if(a===-1) s+=M+'x²';
    else s+=a+'x²';
  }
  if(b!==0){
    if(s===''){
      s += fmtCoef(b);
    } else {
      s += fmtCoefMid(b);
    }
  }
  if(c!==0){
    if(s===''){ s += fmtN(c); }
    else { s += fmtCstMid(c); }
  }
  if(s==='') s='0';
  return s;
}

/* ======================================================================== */
/* GÉNÉRATEURS                                                                */
/* ======================================================================== */

/* ---- 1. TRADUIRE ---- */
const traduireGens = [
  // Le double / triple / ... de x
  () => {
    const mots = {2:'double',3:'triple',4:'quadruple',5:'quintuple'};
    const n = rand(2,5);
    const expoBad = n===2 ? 'x²' : `x^${n}`;
    return {
      q:`Le ${mots[n]} de x`,
      ans:fmtCoef(n),
      bad:[`x + ${n}`, `${n} + x`, expoBad, `x ÷ ${n}`],
      hint:`« ${mots[n]} de x » signifie ${n} fois x, donc ${n}×x = ${n}x.`,
    };
  },
  // Le produit de N par x
  () => {
    const n = rand(2,9);
    return {
      q:`Le produit de ${n} par x`,
      ans:`${n}x`,
      bad:[`x + ${n}`, `x ${M} ${n}`, `x${n}`],
      hint:`« Produit » = multiplication. ${n} × x s'écrit ${n}x.`,
    };
  },
  // x augmenté de N
  () => {
    const n = rand(2,15);
    return {
      q:`x augmenté de ${n}`,
      ans:`x + ${n}`,
      bad:[`${n}x`, `x ${M} ${n}`, `${n} ${M} x`],
      hint:`« Augmenté de ${n} » signifie qu'on ajoute ${n}. On écrit donc x + ${n}.`,
    };
  },
  // x diminué de N
  () => {
    const n = rand(2,15);
    return {
      q:`x diminué de ${n}`,
      ans:`x ${M} ${n}`,
      bad:[`${n} ${M} x`, `x + ${n}`, `${n}x`],
      hint:`« Diminué de ${n} » signifie qu'on retire ${n}. On écrit donc x ${M} ${n}.`,
    };
  },
  // N diminué de x
  () => {
    const n = rand(5,20);
    return {
      q:`${n} diminué de x`,
      ans:`${n} ${M} x`,
      bad:[`x ${M} ${n}`, `x + ${n}`, `${n}x`],
      hint:`Ici c'est ${n} (le grand) auquel on enlève x. On écrit ${n} ${M} x.`,
    };
  },
  // Le double de x augmenté de N
  () => {
    const a = rand(2,9), b = rand(2,12);
    return {
      q:`Le double de x, augmenté de ${b}`,
      ans:`2x + ${b}`,
      bad:[`2(x + ${b})`, `x + ${2+b}`, `2x ${M} ${b}`],
      hint:`Double de x = 2x. Augmenté de ${b} : on ajoute ${b}. → 2x + ${b}.`,
    };
  },
  // a fois x diminué de b
  () => {
    const a = rand(2,9), b = rand(2,12);
    return {
      q:`${a} fois x, diminué de ${b}`,
      ans:`${a}x ${M} ${b}`,
      bad:[`${a}(x ${M} ${b})`, `x ${M} ${a*b}`, `${a}x + ${b}`],
      hint:`${a} fois x = ${a}x. Diminué de ${b} : on retire ${b}. → ${a}x ${M} ${b}.`,
    };
  },
  // Le carré de x
  () => ({
    q:`Le carré de x`,
    ans:`x²`,
    bad:[`2x`, `x × 2`, `x + x`],
    hint:`« Carré » = multiplier par soi-même. x × x = x².`,
  }),
  // Le carré de x augmenté de x
  () => ({
    q:`Le carré de x, augmenté de x`,
    ans:`x² + x`,
    bad:[`2x`, `x³`, `x²·x`],
    hint:`Carré de x = x². On ajoute x → x² + x. (Attention : ce ne sont pas des termes semblables !)`,
  }),
  // a fois la somme de x et b
  () => {
    const a = rand(2,5), b = rand(2,9);
    return {
      q:`${a} fois la somme de x et de ${b}`,
      ans:`${a}(x + ${b})`,
      bad:[`${a}x + ${b}`, `x + ${a*b}`, `${a}x + ${a+b}`],
      hint:`« La somme de x et de ${b} » = (x + ${b}). On la multiplie par ${a} → ${a}(x + ${b}).`,
    };
  },
  // a fois la différence entre x et b
  () => {
    const a = rand(2,5), b = rand(2,9);
    return {
      q:`${a} fois la différence entre x et ${b}`,
      ans:`${a}(x ${M} ${b})`,
      bad:[`${a}x ${M} ${b}`, `x ${M} ${a*b}`, `${a}x ${M} ${a+b}`],
      hint:`« Différence entre x et ${b} » = (x ${M} ${b}). Multipliée par ${a} → ${a}(x ${M} ${b}).`,
    };
  },
  // La moitié de x
  () => ({
    q:`La moitié de x`,
    ans:`x ÷ 2`,
    bad:[`2x`, `x ${M} 2`, `x²`],
    hint:`« Moitié » = divisé par 2. On écrit x ÷ 2 (ou x/2).`,
  }),
];

function genTraduire(){
  const g = pick(traduireGens)();
  // dédoublonner les mauvais et garder 3
  const bad = unique(g.bad).filter(x=>x!==g.ans).slice(0,3);
  while(bad.length<3) bad.push('autre');
  const choices = shuffle([g.ans, ...bad]);
  return { type:'qcm', question:g.q, questionFr:true, choices, correct:g.ans, hint:g.hint };
}

/* ---- 2. CALCULER ---- */
const calculerGens = [
  // ax + b
  () => {
    const a = rand(2,8), b = rand(-9,9);
    return {
      coefStr:`${a}x${fmtCstMid(b)}`,
      f:(x)=>a*x + b,
      step:(x)=>{
        const ax = a*x;
        return `${a}×(${x})${fmtCstMid(b)} = ${fmtN(ax)}${fmtCstMid(b)} = ${fmtN(a*x+b)}`;
      }
    };
  },
  // -ax + b (ie b - ax)
  () => {
    const a = rand(2,7), b = rand(2,12);
    return {
      coefStr:`${b} ${M} ${a}x`,
      f:(x)=>b - a*x,
      step:(x)=>{
        const ax = a*x;
        return `${b} ${M} ${a}×(${x}) = ${b} ${M} (${fmtN(ax)}) = ${fmtN(b-a*x)}`;
      }
    };
  },
  // ax^2 + b
  () => {
    const a = rand(1,3), b = rand(-9,9);
    const aStr = a===1?'':''+a;
    return {
      coefStr:`${aStr}x²${fmtCstMid(b)}`,
      f:(x)=>a*x*x + b,
      step:(x)=>{
        const x2 = x*x;
        return `${aStr}×(${x})²${fmtCstMid(b)} = ${aStr}×${x2}${fmtCstMid(b)} = ${fmtN(a*x2)}${fmtCstMid(b)} = ${fmtN(a*x2+b)}`;
      }
    };
  },
  // a(x+b)
  () => {
    const a = rand(2,5), b = rand(-5,5,);
    return {
      coefStr:`${a}(x${fmtCstMid(b)})`,
      f:(x)=>a*(x+b),
      step:(x)=>{
        return `${a}×(${x}${fmtCstMid(b)}) = ${a}×(${fmtN(x+b)}) = ${fmtN(a*(x+b))}`;
      }
    };
  },
];

function genCalculer(){
  const g = pick(calculerGens)();
  // 2 valeurs : une positive, une négative typiquement
  const positives = [1,2,3,4];
  const negatives = [-1,-2,-3,-4];
  const x1 = pick(positives);
  const x2 = pick(negatives);
  return {
    type:'calc',
    expr:g.coefStr,
    x1, x2,
    a1:g.f(x1), a2:g.f(x2),
    hint1:g.step(x1),
    hint2:g.step(x2),
  };
}

/* ---- 3. DÉVELOPPER ---- */
const developperGens = [
  // a(x + b)
  () => {
    const a = rand(2,9), b = rand(2,9);
    const ans = `${a}x + ${a*b}`;
    return {
      q:`${a}(x + ${b})`,
      ans,
      bad:[
        `${a}x + ${b}`,                // distri ratée
        `x + ${a+b}`,                  // ne distribue pas
        `${a}x ${M} ${a*b}`,           // signe faux
      ],
      hint:`On distribue : ${a}(x + ${b}) = ${a}×x + ${a}×${b} = ${a}x + ${a*b}.`
    };
  },
  // a(x - b)
  () => {
    const a = rand(2,9), b = rand(2,9);
    const ans = `${a}x ${M} ${a*b}`;
    return {
      q:`${a}(x ${M} ${b})`,
      ans,
      bad:[
        `${a}x ${M} ${b}`,
        `${a}x + ${a*b}`,
        `x ${M} ${a+b}`,
      ],
      hint:`On distribue : ${a}(x ${M} ${b}) = ${a}×x ${M} ${a}×${b} = ${a}x ${M} ${a*b}.`
    };
  },
  // (x + a)(x + b)
  () => {
    const a = rand(2,7), b = rand(2,7);
    const sum = a+b, prod = a*b;
    const ans = `x² + ${sum}x + ${prod}`;
    return {
      q:`(x + ${a})(x + ${b})`,
      ans,
      bad:[
        `x² + ${prod}x + ${sum}`,
        `x² + ${a*b}`,
        `x² + ${sum}x ${M} ${prod}`,
      ],
      hint:`(x + ${a})(x + ${b}) = x×x + x×${b} + ${a}×x + ${a}×${b}<br>&nbsp;&nbsp;&nbsp;= x² + ${b}x + ${a}x + ${prod}<br>&nbsp;&nbsp;&nbsp;= x² + ${sum}x + ${prod}.`
    };
  },
  // (x - a)(x + b)  attention signes
  () => {
    let a = rand(2,6), b = rand(2,6);
    if(a===b) b = b===6 ? 5 : b+1;     // évite a=b (sinon mid=0 et collisions)
    const mid = b - a;
    const prod = a*b;
    let midStr;
    if(mid===0)        midStr = '';
    else if(mid===1)   midStr = ` + x`;
    else if(mid===-1)  midStr = ` ${M} x`;
    else if(mid>0)     midStr = ` + ${mid}x`;
    else               midStr = ` ${M} ${Math.abs(mid)}x`;
    const ans = `x²${midStr} ${M} ${prod}`;
    return {
      q:`(x ${M} ${a})(x + ${b})`,
      ans,
      bad:[
        `x² + ${a+b}x + ${prod}`,
        `x²${midStr} + ${prod}`,
        `x² + ${a+b}x ${M} ${prod}`,
      ],
      hint:`(x ${M} ${a})(x + ${b}) = x² + ${b}x ${M} ${a}x ${M} ${prod}<br>&nbsp;&nbsp;&nbsp;= x²${midStr} ${M} ${prod}.`
    };
  },
];

function genDevelopper(){
  const g = pick(developperGens)();
  const bad = unique(g.bad).filter(x=>x!==g.ans).slice(0,3);
  while(bad.length<3) bad.push('autre');
  const choices = shuffle([g.ans, ...bad]);
  return { type:'qcm', question:g.q, choices, correct:g.ans, hint:g.hint };
}

/* ---- 4. RÉDUIRE ---- */
function genReduire(){
  // 4 sous-types
  const t = pick(['simple','classic','complex','x2']);

  if(t==='simple'){
    // a*x + b*x
    let a = rand(2,9), b = rand(2,9);
    if(a+b === a*b) b = b===2 ? 3 : 2;   // évite a+b = a*b
    const sum = a+b;
    const ans = fmtCoef(sum);
    const q = `${a}x + ${b}x`;
    const bad = [
      fmtCoef(a*b),                    // a multiplié b
      `${sum}x²`,                      // ajouté les puissances
      `${a}x² + ${b}x`,                // n'importe quoi
    ];
    return makeReduireQ(q, ans, bad,
      reduireDecomp([{c:a,sgn:1},{c:b,sgn:1}], [], `${a}x + ${b}x`, ans)
    );
  }

  if(t==='classic'){
    // 8x − 5 − 12x + 8 type :  ax + b − cx + d
    const a = rand(3,9);
    const c = rand(a+2,15);
    const b = rand(2,9);
    const d = rand(2,9);
    const xCoef = a - c;     // négatif
    const cst = -b + d;
    const ans = fmtPoly2(0, xCoef, cst);
    const q = `${a}x ${M} ${b} ${M} ${c}x + ${d}`;
    const bad = [
      fmtPoly2(0, a+c, -b+d),
      fmtPoly2(0, xCoef, -b-d),
      fmtPoly2(0, a-c, b+d),
    ];
    return makeReduireQ(q, ans, bad,
      reduireDecomp(
        [{c:a,sgn:1}, {c:c,sgn:-1}],
        [{val:-b},{val:d}],
        q, ans
      )
    );
  }

  if(t==='complex'){
    // 2x + 4 − x − 3
    const a = rand(2,6);
    const b = rand(2,9);
    const c = 1;
    const d = rand(2,9);
    const xCoef = a - c;
    const cst = b - d;
    const ans = fmtPoly2(0, xCoef, cst);
    const q = `${a}x + ${b} ${M} x ${M} ${d}`;
    const bad = [
      fmtPoly2(0, a+c, b-d),
      fmtPoly2(0, xCoef, b+d),
      fmtPoly2(0, a+c, b+d),
    ];
    return makeReduireQ(q, ans, bad,
      reduireDecomp(
        [{c:a,sgn:1}, {c:c,sgn:-1}],
        [{val:b},{val:-d}],
        q, ans
      )
    );
  }

  if(t==='x2'){
    // 11x² + 5 + 3x − 6x² + x  ->  5x² + 4x + 5
    const a = rand(6,12), c = rand(2,a-1);
    const x2coef = a - c;
    const xa = rand(2,5), xc = 1;
    const xCoef = xa + xc;
    const cst = rand(2,9);
    const ans = fmtPoly2(x2coef, xCoef, cst);
    const q = `${a}x² + ${cst} + ${xa}x ${M} ${c}x² + x`;
    const bad = [
      fmtPoly2(a+c, xCoef, cst),
      fmtPoly2(x2coef, xa*xc, cst),
      `${x2coef+xCoef}x² + ${cst}`,
    ];
    return makeReduireQ(q, ans, bad,
      reduireDecomp_x2(
        [{c:a,sgn:1},{c:c,sgn:-1}],
        [{c:xa,sgn:1},{c:xc,sgn:1}],
        [{val:cst}],
        q, ans
      )
    );
  }
}

function makeReduireQ(q, ans, badArr, hintHTML){
  const bad = unique(badArr).filter(x=>x!==ans).slice(0,3);
  while(bad.length<3) bad.push('autre');
  const choices = shuffle([ans, ...bad]);
  return { type:'qcm', question:q, choices, correct:ans, hint:hintHTML };
}

// Décomposition visuelle x+x+x... pour mode classique sans x²
function reduireDecomp(xTerms, cstTerms, qStr, ansStr){
  // xTerms : [{c, sgn}], cstTerms : [{val (signed)}]
  let totalPos = 0, totalNeg = 0;
  let posStr='', negStr='';
  xTerms.forEach(({c,sgn}) => {
    if(sgn>0){
      totalPos += c;
      for(let i=0;i<c;i++) posStr += '+x ';
    } else {
      totalNeg += c;
      for(let i=0;i<c;i++) negStr += M+'x ';
    }
  });
  const xCoef = totalPos - totalNeg;

  let cstCalc = '';
  let totalCst = 0;
  cstTerms.forEach(({val},i)=>{
    if(i===0) cstCalc += (val<0?M+Math.abs(val):val);
    else cstCalc += (val<0?' '+M+' '+Math.abs(val):' + '+val);
    totalCst += val;
  });
  cstCalc += ` = ${fmtN(totalCst)}`;

  let html = `<div class="decomp">`;
  if(posStr){
    html += `<div class="row"><span class="lbl">x positifs (${totalPos}) :</span><span class="pos math">${posStr.trim()}</span></div>`;
  }
  if(negStr){
    html += `<div class="row"><span class="lbl">x négatifs (${totalNeg}) :</span><span class="neg math">${negStr.trim()}</span></div>`;
  }
  html += `<div class="row"><span class="lbl">Bilan des x :</span>
            <span class="math">${totalPos} ${M} ${totalNeg} = <b>${fmtN(xCoef)}</b></span>
            <span>donc <b class="math">${fmtCoef(xCoef)}</b></span></div>`;
  if(cstTerms.length){
    html += `<div class="row"><span class="lbl">Nombres seuls :</span><span class="cst math">${cstCalc}</span></div>`;
  }
  html += `<div class="eq-result math">${qStr} &nbsp;=&nbsp; ${ansStr}</div>`;
  html += `</div>`;
  return html;
}

// version avec x²
function reduireDecomp_x2(x2Terms, xTerms, cstTerms, qStr, ansStr){
  let html = `<div class="decomp">`;

  // x²
  let p2=0,n2=0;
  x2Terms.forEach(({c,sgn})=>sgn>0 ? p2+=c : n2+=c);
  let pos2='', neg2='';
  for(let i=0;i<p2;i++) pos2+='+x² ';
  for(let i=0;i<n2;i++) neg2+=M+'x² ';
  html += `<div class="row"><span class="lbl">x² positifs (${p2}) :</span><span class="pos math">${pos2.trim()}</span></div>`;
  if(n2) html += `<div class="row"><span class="lbl">x² négatifs (${n2}) :</span><span class="neg math">${neg2.trim()}</span></div>`;
  html += `<div class="row"><span class="lbl">Bilan x² :</span><span class="math">${p2} ${M} ${n2} = <b>${fmtN(p2-n2)}</b></span></div>`;

  // x
  let p1=0,n1=0;
  xTerms.forEach(({c,sgn})=>sgn>0 ? p1+=c : n1+=c);
  let pos1='';
  for(let i=0;i<p1;i++) pos1+='+x ';
  html += `<div class="row"><span class="lbl">x positifs (${p1}) :</span><span class="pos math">${pos1.trim()}</span></div>`;

  // constantes
  let totalCst = 0;
  cstTerms.forEach(({val})=>totalCst+=val);
  html += `<div class="row"><span class="lbl">Nombres seuls :</span><span class="cst math">${fmtN(totalCst)}</span></div>`;

  html += `<div class="eq-result math">${qStr} &nbsp;=&nbsp; ${ansStr}</div>`;
  html += `</div>`;
  return html;
}

function check(){
  if(state.answered) return;
  const q = state.current;
  if(!q) return;

  let isCorrect = false;
  const card = document.getElementById('exercise');
  const fb = document.getElementById('feedback');

  if(q.type==='qcm'){
    const sel = card.querySelector('.choice.selected');
    if(!sel){
      fb.className='feedback show error';
      fb.textContent='⚠️ Choisis une réponse avant de vérifier.';
      return;
    }
    const choiceText = sel.textContent;
    isCorrect = (choiceText === q.correct);
    // verrouille
    card.querySelectorAll('.choice').forEach(b=>{
      b.classList.add('locked');
      if(b.textContent === q.correct) b.classList.add('correct');
      else if(b.classList.contains('selected')) b.classList.add('incorrect');
    });
  }

  if(q.type==='calc'){
    const a1 = parseInputNum(document.getElementById('ans1').value);
    const a2 = parseInputNum(document.getElementById('ans2').value);
    const ok1 = (a1!==null && a1===q.a1);
    const ok2 = (a2!==null && a2===q.a2);
    document.getElementById('cp1').classList.add(ok1?'ok':'ko');
    document.getElementById('cp2').classList.add(ok2?'ok':'ko');
    isCorrect = ok1 && ok2;
    if(!isCorrect){
      fb.className='feedback show error';
      fb.innerHTML = `❌ Pas tout à fait. Les bonnes réponses :<br>
        Pour x = ${fmtN(q.x1)} → <b class="math">${fmtN(q.a1)}</b><br>
        Pour x = ${fmtN(q.x2)} → <b class="math">${fmtN(q.a2)}</b>`;
    }
  }

  state.answered = true;
  state.total++;
  if(isCorrect){
    state.good++;
    if(q.type==='qcm' || q.type==='calc'){
      if(fb.className.indexOf('error')===-1){
        fb.className='feedback show success';
        fb.textContent = pickBravo();
      }
    }
  } else {
    if(q.type==='qcm'){
      fb.className='feedback show error';
      fb.innerHTML = `❌ La bonne réponse était : <b class="math">${q.correct}</b>`;
    }
  }
  updateScore();
}

function parseInputNum(s){
  if(!s) return null;
  s = s.trim().replace(',','.').replace('−','-').replace(/\s+/g,'');
  if(!/^-?\d+(\.\d+)?$/.test(s)) return null;
  return Math.round(parseFloat(s)*1000)/1000;
}

function pickBravo(){
  return pick([
    '✅ Bravo, c\'est exact !',
    '✅ Excellent !',
    '✅ Parfait, tu maîtrises.',
    '✅ Bonne réponse !',
    '✅ Top, continue !',
  ]);
}

function updateScore(){
  document.getElementById('score').textContent = `${state.good} / ${state.total}`;
  const r = state.total ? Math.round(100*state.good/state.total)+' %' : '—';
  document.getElementById('rate').textContent = r;
}

function resetScore(){
  state.good=0;state.total=0;
  updateScore();
}

const tabLabels = {
  traduire:'Traduire en formule littérale',
  calculer:'Calculer une expression numérique',
  developper:'Développer une expression',
  reduire:'Réduire une expression',
};
const tabPrompts = {
  traduire:'Entoure l\'expression mathématique correspondant à la phrase :',
  calculer:'Calcule la valeur de l\'expression pour chaque valeur de x :',
  developper:'Entoure la forme développée et réduite de l\'expression :',
  reduire:'Entoure la forme réduite de l\'expression :',
};
const generators = {
  traduire:genTraduire, calculer:genCalculer,
  developper:genDevelopper, reduire:genReduire,
};

function distribute10(tabs){
  const k = tabs.length;
  const base = Math.floor(10/k);
  const rem = 10 % k;
  return tabs.map((t,i) => ({tab:t, count: base + (i<rem?1:0)}));
}

function selectedTabs(){
  return [...document.querySelectorAll('#modal-checks input:checked')].map(c=>c.value);
}

function refreshDistInfo(){
  const sel = selectedTabs();
  const el = document.getElementById('dist-info');
  // Mise à jour visuelle des labels
  document.querySelectorAll('#modal-checks label').forEach(l=>{
    l.classList.toggle('on', l.querySelector('input').checked);
  });
  if(sel.length===0){
    el.className='dist-info warn';
    el.textContent='⚠️ Sélectionne au moins un onglet';
    document.getElementById('modal-confirm').disabled = true;
    return;
  }
  const d = distribute10(sel).map(x=>x.count);
  el.className='dist-info ok';
  el.textContent = `→ ${d.join(' + ')} = 10 exercices`;
  document.getElementById('modal-confirm').disabled = false;
}

function buildFiche(tabs){
  const dist = distribute10(tabs);
  const sections = [];
  let n = 1;
  for(const {tab, count} of dist){
    const items = [];
    const seen = new Set();
    for(let i=0;i<count;i++){
      let q, tries=0;
      do {
        q = generators[tab]();
        tries++;
      } while(seen.has(q.question || q.expr) && tries<25);
      seen.add(q.question || q.expr);
      items.push({...q, num:n++});
    }
    sections.push({tab, label:tabLabels[tab], prompt:tabPrompts[tab], items});
  }
  return sections;
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

      <div class="ex">

function openPrintWindow(sections){
  const date = new Date().toLocaleDateString('fr-FR');
  const exHtml = sections.map(s => {
    const allQcm = s.items.every(i => i.type === 'qcm');
    const cols = allQcm ? s.items.length : 1;
    const inner = allQcm
      ? `<div class="ex-grid ex-grid-${Math.min(cols,3)}">${s.items.map(exerciseHtml).join('')}</div>`
      : s.items.map(exerciseHtml).join('');
    return `
    <section class="sec">
      <h2>${escapeHtml(s.label)}</h2>
      <p class="instr">${escapeHtml(s.prompt)}</p>
      ${inner}
    </section>`;
  }).join('');

  const corrigeBlocks = sections.map(s => `
    <div class="cor-sec">
      <h3>${escapeHtml(s.label)}</h3>
      ${s.items.map(corrigeHtml).join('')}
    </div>
  `).join('');

      header,.id-line,.sec,.corrige-page{

  const html = `<!DOCTYPE html>

  const w = window.open('', '_blank');
  if(!w){
    alert("Le navigateur a bloqué l'ouverture de la fenêtre. Autorise les popups pour ce site puis réessaie.");
    return;
  }

  w.document.write(html);
  w.document.close();

document.addEventListener('keydown',(e)=>{
  // Si modale ouverte : Entrée valide, Échap ferme, rien d'autre
  if(document.getElementById('modal-fiche').classList.contains('show')){
    if(e.key==='Enter' && !document.getElementById('modal-confirm').disabled){
      document.getElementById('modal-confirm').click();
    }
    return;
  }
  if(e.key==='Enter'){
    if(state.answered) render();
    else check();
  }
});

// Initial
